function formatDistance(m) {

    const km = m / 1000;
    return Number.isInteger(km) ? `${km} km` : `${km.toFixed(1)} km`;

  return `${m} m`;

  }
  return url;

function haversine(a, b) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const la1 = toRad(a.lat);
  const la2 = toRad(b.lat);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function generateGridCenters(google, center, radius, step) {
  const centers = [];
  const latStep = step / 111000;
  const lngStep = step / (111000 * Math.cos(center.lat * Math.PI / 180));
  const latRange = radius / 111000;
  const lngRange = latRange / Math.cos(center.lat * Math.PI / 180);

  for (let lat = center.lat - latRange; lat <= center.lat + latRange; lat += latStep) {
    for (let lng = center.lng - lngRange; lng <= center.lng + lngRange; lng += lngStep) {
      let dist = radius + 1;
      if (google.maps.geometry && google.maps.geometry.spherical) {
        dist = google.maps.geometry.spherical.computeDistanceBetween(
          new google.maps.LatLng(center.lat, center.lng),
          new google.maps.LatLng(lat, lng)
        );
      } else {
        dist = Math.max(
          Math.abs(lat - center.lat) * 111000,
          Math.abs(lng - center.lng) * 111000 * Math.cos(center.lat * Math.PI / 180)
        );
      }
      if (dist <= radius) centers.push({ lat, lng });
    }
  }
  return centers;
}

async function searchSingleAreaLegacy(google, service, S, center, radius) {
  const all = [];
  let pagination = null;
  let page = 0;
  const MAX_PAGES = 3;

  const request = {
    location: new google.maps.LatLng(center.lat, center.lng),
    radius: Math.floor(radius),
    keyword: 'toy store OR hobby shop OR collectibles OR action figures OR model kits',
    type: 'toy_store',
    language: 'zh-HK'
  };

  do {
    const pageData = await new Promise((resolve, reject) => {
      service.nearbySearch(request, (results, status, paginator) => {
        if (status === S.OK) resolve({ results: results || [], pagination: paginator });
        else if (status === S.ZERO_RESULTS) resolve({ results: [], pagination: null });
        else reject(new Error(`Status: ${status}`));
      });
    });
    if (pageData.results.length > 0) all.push(...pageData.results);
    pagination = pageData.pagination;
    page++;
    if (pagination && pagination.hasNextPage && page < MAX_PAGES) {
      await new Promise(r => setTimeout(r, 2000));
      pagination.nextPage();
    } else {
      break;
    }
  } while (page < MAX_PAGES);

  return all;
}

function getRectangleFromCircle(lat, lng, radiusInMeters) {
    const EARTH_RADIUS = 6378137; // 地球半徑 (米)
    
    // 緯度的偏移量
    const dLat = radiusInMeters / EARTH_RADIUS;
    // 經度的偏移量 (考慮到緯度會影響經度距離)
    const dLng = radiusInMeters / (EARTH_RADIUS * Math.cos(Math.PI * lat / 180));

    return new google.maps.LatLngBounds(
        { lat: lat - (dLat * 180 / Math.PI), lng: lng - (dLng * 180 / Math.PI) }, // 西南角 (Southwest)
        { lat: lat + (dLat * 180 / Math.PI), lng: lng + (dLng * 180 / Math.PI) }  // 東北角 (Northeast)
      );
}

async function searchSingleAreaNewAPI(google, Place, rankPreference, center, radius) {
    const allPlaces = new Map();
    const MAX_PAGES = 3;
    const DELAY_BETWEEN_PAGES = 2200;

    const searchQueries = [
        "toys OR hobbies OR action figures OR model kits OR collectibles",
        "designer toys OR retro toys OR sofubi OR diecast cars"
    ];

    for (const textQuery of searchQueries) {
        let pageToken = null;
        let page = 0;

        do {
            const request = {
                textQuery: textQuery,
                fields: PLACE_FIELDS,
                includedType: 'toy_store',
                useStrictTypeFiltering: true,
                locationRestriction: getRectangleFromCircle(center.lat, center.lng, radius),
                maxResultCount: 20,
                rankPreference: "RELEVANCE",
            };

            if (pageToken) {
                request.pageToken = pageToken;
            }

            try {
                const response = await Place.searchByText(request);
                const results = response.places || [];

                results.forEach(place => {
                    if (place.id) {
                        allPlaces.set(place.id, place); // 自動去重
                    }
                });

                pageToken = response.nextPageToken;
                page++;

                // 避免超過配額
                if (pageToken && page < MAX_PAGES) {
                    await new Promise(resolve => setTimeout(resolve, DELAY_BETWEEN_PAGES));
                }
            } catch (error) {
                console.warn(`搜尋 "${textQuery}" 失敗:`, error);
                break;
            }
        } while (pageToken && page < MAX_PAGES);
    }

    const finalResults = Array.from(allPlaces.values());
    
    console.log(`共找到 ${finalResults.length} 間玩具相關店家 (去重後)`);
    return finalResults;
}
